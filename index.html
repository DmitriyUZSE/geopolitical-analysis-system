<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geopolitical Analysis System v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🌍 Geopolitical Analysis System v2.0</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#" data-page="baseline">Baseline</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-page="builder">Scenario Builder</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-page="cascade">Cascade Viewer</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-page="comparison">Comparison</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div id="baseline-page" class="page-content">
            <h2>Baseline Explorer</h2>
            <div class="row mb-3">
                <div class="col-md-4">
                    <select id="actor-select" class="form-select"><option value="">-- Select Actor --</option></select>
                </div>
            </div>
            <div id="parameter-display"></div>
        </div>

        <div id="builder-page" class="page-content" style="display:none;">
            <h2>Scenario Builder</h2>
            <div class="scenario-builder">
                <h4>Basic Information</h4>
                <div class="mb-3"><input type="text" id="scenario-name" class="form-control" placeholder="Scenario Name"></div>
                <div class="mb-3"><textarea id="scenario-description" class="form-control" rows="2"></textarea></div>
                <h4 class="mt-4">Parameter Overrides</h4>
                <div id="overrides-container"></div>
                <button class="btn btn-secondary mt-2" onclick="addOverride()">+ Add Override</button>
                <div class="mt-4"><button class="btn btn-generate btn-lg" onclick="generateScenario()">🚀 Generate Cascade</button></div>
            </div>
        </div>

        <div id="cascade-page" class="page-content" style="display:none;">
            <h2>Cascade Viewer</h2>
            <div class="row mb-3">
                <div class="col-md-4"><select id="scenario-select" class="form-select"><option value="">-- Select Scenario --</option></select></div>
            </div>
            <div id="cascade-display"></div>
        </div>

        <div id="comparison-page" class="page-content" style="display:none;">
            <h2>Scenario Comparison</h2>
            <div id="scenario-checkboxes" class="mb-3"></div>
            <button class="btn btn-primary" onclick="compareScenarios()">Compare</button>
            <div id="comparison-results" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cascade-engine.js"></script>
    <script>
const BASELINE_DATA={"USA":{"economic_diversification":"very_high","fiscal_resilience":"medium","trade_integration_depth":"high","technology_production_capacity":"very_high","energy_autonomy":"high","institutional_stability":"high","regime_legitimacy_basis":"high","policy_implementation_capacity":"high","elite_cohesion":"medium","social_contract_strength":"medium","military_capability_tier":"very_high","alliance_dependency":"low","strategic_depth":"very_high","domestic_security_control":"high","cyber_defensive_capacity":"very_high","resource_leverage_potential":"high","financial_system_centrality":"very_high","infrastructure_connectivity":"very_high","demographic_pressure":"low","ideological_mobilization_capacity":"medium"},"China":{"economic_diversification":"high","fiscal_resilience":"high","trade_integration_depth":"very_high","technology_production_capacity":"high","energy_autonomy":"low","institutional_stability":"high","regime_legitimacy_basis":"medium","policy_implementation_capacity":"very_high","elite_cohesion":"high","social_contract_strength":"medium","military_capability_tier":"high","alliance_dependency":"low","strategic_depth":"very_high","domestic_security_control":"very_high","cyber_defensive_capacity":"high","resource_leverage_potential":"high","financial_system_centrality":"medium","infrastructure_connectivity":"very_high","demographic_pressure":"high","ideological_mobilization_capacity":"high"},"Russia":{"economic_diversification":"low","fiscal_resilience":"medium","trade_integration_depth":"medium","technology_production_capacity":"medium","energy_autonomy":"very_high","institutional_stability":"medium","regime_legitimacy_basis":"medium","policy_implementation_capacity":"medium","elite_cohesion":"high","social_contract_strength":"low","military_capability_tier":"high","alliance_dependency":"very_low","strategic_depth":"very_high","domestic_security_control":"high","cyber_defensive_capacity":"high","resource_leverage_potential":"very_high","financial_system_centrality":"low","infrastructure_connectivity":"medium","demographic_pressure":"medium","ideological_mobilization_capacity":"medium"},"India":{"economic_diversification":"medium","fiscal_resilience":"medium","trade_integration_depth":"medium","technology_production_capacity":"medium","energy_autonomy":"low","institutional_stability":"medium","regime_legitimacy_basis":"high","policy_implementation_capacity":"medium","elite_cohesion":"medium","social_contract_strength":"medium","military_capability_tier":"medium","alliance_dependency":"medium","strategic_depth":"high","domestic_security_control":"medium","cyber_defensive_capacity":"medium","resource_leverage_potential":"low","financial_system_centrality":"low","infrastructure_connectivity":"medium","demographic_pressure":"high","ideological_mobilization_capacity":"high"},"Germany":{"economic_diversification":"very_high","fiscal_resilience":"high","trade_integration_depth":"very_high","technology_production_capacity":"high","energy_autonomy":"very_low","institutional_stability":"very_high","regime_legitimacy_basis":"high","policy_implementation_capacity":"high","elite_cohesion":"medium","social_contract_strength":"high","military_capability_tier":"medium","alliance_dependency":"high","strategic_depth":"low","domestic_security_control":"very_high","cyber_defensive_capacity":"high","resource_leverage_potential":"low","financial_system_centrality":"medium","infrastructure_connectivity":"very_high","demographic_pressure":"medium","ideological_mobilization_capacity":"low"},"Japan":{"economic_diversification":"very_high","fiscal_resilience":"low","trade_integration_depth":"very_high","technology_production_capacity":"very_high","energy_autonomy":"very_low","institutional_stability":"very_high","regime_legitimacy_basis":"high","policy_implementation_capacity":"very_high","elite_cohesion":"high","social_contract_strength":"high","military_capability_tier":"medium","alliance_dependency":"very_high","strategic_depth":"low","domestic_security_control":"very_high","cyber_defensive_capacity":"high","resource_leverage_potential":"very_low","financial_system_centrality":"high","infrastructure_connectivity":"very_high","demographic_pressure":"very_high","ideological_mobilization_capacity":"low"}};
const PARAM_NAMES={"economic_diversification":"Economic Diversification","fiscal_resilience":"Fiscal Resilience","trade_integration_depth":"Trade Integration","technology_production_capacity":"Tech Production","energy_autonomy":"Energy Autonomy","institutional_stability":"Institutional Stability","regime_legitimacy_basis":"Regime Legitimacy","policy_implementation_capacity":"Policy Capacity","elite_cohesion":"Elite Cohesion","social_contract_strength":"Social Contract","military_capability_tier":"Military Capability","alliance_dependency":"Alliance Dependency","strategic_depth":"Strategic Depth","domestic_security_control":"Domestic Security","cyber_defensive_capacity":"Cyber Defense","resource_leverage_potential":"Resource Leverage","financial_system_centrality":"Financial Centrality","infrastructure_connectivity":"Infrastructure","demographic_pressure":"Demographics","ideological_mobilization_capacity":"Ideological Mobilization"};
let SCENARIO_LIBRARY={};let overrideCounter=0;const engine=new CascadeEngine();
function init(){Object.keys(BASELINE_DATA).forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a.replace('_',' ');document.getElementById('actor-select').appendChild(o)});document.getElementById('actor-select').addEventListener('change',displayActorParams);document.getElementById('scenario-select').addEventListener('change',displayCascade);document.querySelectorAll('.nav-link').forEach(l=>{l.addEventListener('click',e=>{e.preventDefault();const p=e.target.dataset.page;if(!p)return;document.querySelectorAll('.page-content').forEach(pc=>pc.style.display='none');document.getElementById(p+'-page').style.display='block';document.querySelectorAll('.nav-link').forEach(nl=>nl.classList.remove('active'));e.target.classList.add('active')})})}
function displayActorParams(){const a=document.getElementById('actor-select').value;const d=document.getElementById('parameter-display');if(!a){d.innerHTML='<p class="text-muted">Select an actor</p>';return}const p=BASELINE_DATA[a];let h='<div class="row">';Object.keys(p).forEach(k=>{const v=p[k];h+=`<div class="col-md-6"><div class="parameter-row ${v}"><strong>${PARAM_NAMES[k]}</strong><span class="badge bg-secondary float-end">${v.replace('_',' ').toUpperCase()}</span></div></div>`});h+='</div>';d.innerHTML=h}
function addOverride(){const c=document.getElementById('overrides-container');const id=overrideCounter++;const d=document.createElement('div');d.className='action-item';d.innerHTML=`<div class="row g-2"><div class="col-md-4"><select class="form-select" id="override-actor-${id}"><option value="">Actor</option>${Object.keys(BASELINE_DATA).map(a=>`<option value="${a}">${a.replace('_',' ')}</option>`).join('')}</select></div><div class="col-md-4"><select class="form-select" id="override-param-${id}"><option value="">Parameter</option>${Object.keys(PARAM_NAMES).map(p=>`<option value="${p}">${PARAM_NAMES[p]}</option>`).join('')}</select></div><div class="col-md-3"><select class="form-select" id="override-value-${id}"><option value="very_low">Very Low</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="very_high">Very High</option></select></div><div class="col-md-1"><button class="btn btn-sm btn-danger" onclick="this.parentElement.parentElement.parentElement.remove()">×</button></div></div>`;c.appendChild(d)}
function generateScenario(){const n=document.getElementById('scenario-name').value;const desc=document.getElementById('scenario-description').value;if(!n){alert('Enter name');return}const ov={};for(let i=0;i<overrideCounter;i++){const a=document.getElementById(`override-actor-${i}`);const p=document.getElementById(`override-param-${i}`);const v=document.getElementById(`override-value-${i}`);if(a&&a.value&&p&&p.value){if(!ov[a.value])ov[a.value]={};ov[a.value][p.value]=v.value}}const s={id:n.replace(/\s+/g,'_').toUpperCase(),name:n,description:desc,overrides:ov};const casc=engine.computeCascade(s,BASELINE_DATA);s.cascade=casc;SCENARIO_LIBRARY[s.id]=s;const sel=document.getElementById('scenario-select');const opt=document.createElement('option');opt.value=s.id;opt.textContent=s.name;sel.appendChild(opt);updateCheckboxes();alert('Generated!');document.querySelectorAll('.page-content').forEach(p=>p.style.display='none');document.getElementById('cascade-page').style.display='block';sel.value=s.id;displayCascade()}
function displayCascade(){const id=document.getElementById('scenario-select').value;const d=document.getElementById('cascade-display');if(!id||!SCENARIO_LIBRARY[id]){d.innerHTML='<p class="text-muted">Select scenario</p>';return}const s=SCENARIO_LIBRARY[id];const c=s.cascade;let h=`<div class="card"><div class="card-header bg-primary text-white"><h5>${s.name}</h5><p class="mb-0">${s.description}</p></div></div>`;h+='<div class="card"><div class="card-header"><h5><span class="tier-badge tier-1">TIER 1</span>Direct Effects</h5></div><div class="card-body">';if(c.tier1.length===0)h+='<p class="text-muted">No changes</p>';else c.tier1.forEach(e=>{h+=`<div class="cascade-effect"><strong>${e.actor}</strong> → ${PARAM_NAMES[e.parameter]}<br><span class="badge bg-secondary">${e.baseline}</span> → <span class="badge bg-warning text-dark">${e.new_value}</span><div class="confidence-bar"><div class="confidence-fill" style="width:${e.confidence*100}%"></div></div><small class="text-muted">${e.mechanism}</small></div>`});h+='</div></div>';h+='<div class="card"><div class="card-header"><h5><span class="tier-badge tier-2">TIER 2</span>Secondary</h5></div><div class="card-body">';if(c.tier2.length===0)h+='<p class="text-muted">No effects</p>';else c.tier2.forEach(e=>{h+=`<div class="cascade-effect"><strong>${e.actor}</strong> → ${PARAM_NAMES[e.parameter]}<br><span class="badge bg-secondary">${e.baseline}</span> → <span class="badge bg-warning text-dark">${e.new_value}</span><div class="confidence-bar"><div class="confidence-fill" style="width:${e.confidence*100}%"></div></div><small class="text-muted">Triggered: ${e.triggered_by}<br>${e.mechanism}</small></div>`});h+='</div></div>';h+='<div class="card"><div class="card-header"><h5><span class="tier-badge tier-3">TIER 3</span>Strategic</h5></div><div class="card-body">';if(c.tier3.length===0)h+='<p class="text-muted">No effects</p>';else c.tier3.forEach(e=>{h+=`<div class="cascade-effect"><strong>${e.actor}</strong> → ${PARAM_NAMES[e.parameter]}<br><span class="badge bg-secondary">${e.baseline}</span> → <span class="badge bg-warning text-dark">${e.new_value}</span><div class="confidence-bar"><div class="confidence-fill" style="width:${e.confidence*100}%"></div></div><small class="text-muted">${e.mechanism}</small></div>`});h+='</div></div>';h+='<div class="card"><div class="card-header bg-danger text-white"><h5><span class="tier-badge tier-4">TIER 4</span>Systemic Risks</h5></div><div class="card-body">';if(c.tier4.length===0)h+='<p>No risks</p>';else c.tier4.forEach(l=>{h+=`<div class="feedback-loop"><strong>${l.type.replace(/_/g,' ').toUpperCase()}</strong> (${l.risk})<br>${l.description}</div>`});h+='</div></div>';d.innerHTML=h}
function updateCheckboxes(){const c=document.getElementById('scenario-checkboxes');c.innerHTML='';Object.keys(SCENARIO_LIBRARY).forEach(id=>{const d=document.createElement('div');d.className='form-check';d.innerHTML=`<input class="form-check-input scenario-checkbox" type="checkbox" value="${id}" id="c-${id}"><label class="form-check-label" for="c-${id}">${SCENARIO_LIBRARY[id].name}</label>`;c.appendChild(d)})}
function compareScenarios(){const ch=Array.from(document.querySelectorAll('.scenario-checkbox:checked')).map(c=>c.value);const d=document.getElementById('comparison-results');if(ch.length===0){d.innerHTML='<div class="alert alert-warning">Select scenarios</div>';return}let h='<div class="card"><div class="card-body"><table class="table"><thead><tr><th>Actor.Param</th>';ch.forEach(sid=>h+=`<th>${SCENARIO_LIBRARY[sid].name}</th>`);h+='</tr></thead><tbody>';const all=new Map();ch.forEach(sid=>{const s=SCENARIO_LIBRARY[sid];if(!s||!s.cascade)return;[...s.cascade.tier1,...s.cascade.tier2,...s.cascade.tier3].forEach(c=>{const k=`${c.actor}.${c.parameter}`;if(!all.has(k))all.set(k,{});all.get(k)[sid]=c.new_value})});all.forEach((v,k)=>{const[a,p]=k.split('.');h+=`<tr><td><strong>${a}</strong><br><small>${PARAM_NAMES[p]}</small></td>`;ch.forEach(sid=>{const val=v[sid]||BASELINE_DATA[a][p];const ch=v[sid]&&v[sid]!==BASELINE_DATA[a][p];h+=`<td><span class="badge ${ch?'bg-warning':'bg-secondary'}">${val}</span></td>`});h+='</tr>'});h+='</tbody></table></div></div>';d.innerHTML=h}
window.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
