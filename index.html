<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geopolitical Analysis System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f5f7fa;font-family:'Segoe UI',sans-serif}
        .card{box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:20px;border:none}
        .parameter-row{padding:12px;margin:8px 0;border-radius:6px;background:white;border-left:4px solid #6c757d}
        .parameter-row.very_low{border-left-color:#dc3545;background-color:#f8d7da}
        .parameter-row.low{border-left-color:#fd7e14;background-color:#fff3cd}
        .parameter-row.medium{border-left-color:#ffc107;background-color:#fff8e1}
        .parameter-row.high{border-left-color:#28a745;background-color:#d4edda}
        .parameter-row.very_high{border-left-color:#0d6efd;background-color:#cfe2ff}
        .cascade-effect{background:#f0f8ff;border-left:3px solid #0d6efd;padding:15px;margin:10px 0;border-radius:6px}
        .tier-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:0.8em;font-weight:bold;margin-right:8px;color:white}
        .tier-1{background:#0d6efd}.tier-2{background:#198754}.tier-3{background:#ffc107;color:#000}.tier-4{background:#dc3545}
        .confidence-bar{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin-top:5px}
        .confidence-fill{height:100%;background:linear-gradient(90deg,#dc3545,#ffc107,#28a745)}
        .feedback-loop{background:#fff3cd;border:2px dashed #ffc107;padding:15px;border-radius:8px;margin:15px 0}
        .scenario-builder{background:white;padding:25px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
        .action-item{background:#f8f9fa;padding:15px;margin:10px 0;border-radius:8px;border:1px solid #dee2e6}
        .btn-generate{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;color:white;padding:12px 30px;font-weight:bold}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🌍 Geopolitical Analysis System</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#" onclick="showPage('baseline')">Baseline</a>
                <a class="nav-link" href="#" onclick="showPage('builder')">Builder</a>
                <a class="nav-link" href="#" onclick="showPage('cascade')">Cascade</a>
                <a class="nav-link" href="#" onclick="showPage('comparison')">Compare</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div id="baseline-page">
            <h2>Baseline Explorer</h2>
            <div class="row mb-3">
                <div class="col-md-4">
                    <select id="actor-select" class="form-select" onchange="displayActorParams()">
                        <option value="">-- Select Actor --</option>
                    </select>
                </div>
            </div>
            <div id="parameter-display"></div>
        </div>

        <div id="builder-page" style="display:none;">
            <h2>Scenario Builder</h2>
            <div class="scenario-builder">
                <div class="mb-3">
                    <input type="text" id="scenario-name" class="form-control" placeholder="Scenario Name">
                </div>
                <div class="mb-3">
                    <textarea id="scenario-description" class="form-control" rows="2" placeholder="Description"></textarea>
                </div>
                <h5>Parameter Overrides</h5>
                <div id="overrides-container"></div>
                <button class="btn btn-secondary mt-2" onclick="addOverride()">+ Add Override</button>
                <div class="mt-4">
                    <button class="btn btn-generate btn-lg" onclick="generateScenario()">🚀 Generate Cascade</button>
                </div>
            </div>
        </div>

        <div id="cascade-page" style="display:none;">
            <h2>Cascade Viewer</h2>
            <div class="row mb-3">
                <div class="col-md-4">
                    <select id="scenario-select" class="form-select" onchange="displayCascade()">
                        <option value="">-- Select Scenario --</option>
                    </select>
                </div>
            </div>
            <div id="cascade-display"></div>
        </div>

        <div id="comparison-page" style="display:none;">
            <h2>Scenario Comparison</h2>
            <div id="scenario-checkboxes" class="mb-3"></div>
            <button class="btn btn-primary" onclick="compareScenarios()">Compare</button>
            <div id="comparison-results" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
const BASELINE_DATA={"USA":{"economic_diversification":"very_high","fiscal_resilience":"medium","trade_integration_depth":"high","technology_production_capacity":"very_high","energy_autonomy":"high","institutional_stability":"high","regime_legitimacy_basis":"high","policy_implementation_capacity":"high","elite_cohesion":"medium","social_contract_strength":"medium","military_capability_tier":"very_high","alliance_dependency":"low","strategic_depth":"very_high","domestic_security_control":"high","cyber_defensive_capacity":"very_high","resource_leverage_potential":"high","financial_system_centrality":"very_high","infrastructure_connectivity":"very_high","demographic_pressure":"low","ideological_mobilization_capacity":"medium"},"China":{"economic_diversification":"high","fiscal_resilience":"high","trade_integration_depth":"very_high","technology_production_capacity":"high","energy_autonomy":"low","institutional_stability":"high","regime_legitimacy_basis":"medium","policy_implementation_capacity":"very_high","elite_cohesion":"high","social_contract_strength":"medium","military_capability_tier":"high","alliance_dependency":"low","strategic_depth":"very_high","domestic_security_control":"very_high","cyber_defensive_capacity":"high","resource_leverage_potential":"high","financial_system_centrality":"medium","infrastructure_connectivity":"very_high","demographic_pressure":"high","ideological_mobilization_capacity":"high"},"Russia":{"economic_diversification":"low","fiscal_resilience":"medium","trade_integration_depth":"medium","technology_production_capacity":"medium","energy_autonomy":"very_high","institutional_stability":"medium","regime_legitimacy_basis":"medium","policy_implementation_capacity":"medium","elite_cohesion":"high","social_contract_strength":"low","military_capability_tier":"high","alliance_dependency":"very_low","strategic_depth":"very_high","domestic_security_control":"high","cyber_defensive_capacity":"high","resource_leverage_potential":"very_high","financial_system_centrality":"low","infrastructure_connectivity":"medium","demographic_pressure":"medium","ideological_mobilization_capacity":"medium"},"India":{"economic_diversification":"medium","fiscal_resilience":"medium","trade_integration_depth":"medium","technology_production_capacity":"medium","energy_autonomy":"low","institutional_stability":"medium","regime_legitimacy_basis":"high","policy_implementation_capacity":"medium","elite_cohesion":"medium","social_contract_strength":"medium","military_capability_tier":"medium","alliance_dependency":"medium","strategic_depth":"high","domestic_security_control":"medium","cyber_defensive_capacity":"medium","resource_leverage_potential":"low","financial_system_centrality":"low","infrastructure_connectivity":"medium","demographic_pressure":"high","ideological_mobilization_capacity":"high"},"Germany":{"economic_diversification":"very_high","fiscal_resilience":"high","trade_integration_depth":"very_high","technology_production_capacity":"high","energy_autonomy":"very_low","institutional_stability":"very_high","regime_legitimacy_basis":"high","policy_implementation_capacity":"high","elite_cohesion":"medium","social_contract_strength":"high","military_capability_tier":"medium","alliance_dependency":"high","strategic_depth":"low","domestic_security_control":"very_high","cyber_defensive_capacity":"high","resource_leverage_potential":"low","financial_system_centrality":"medium","infrastructure_connectivity":"very_high","demographic_pressure":"medium","ideological_mobilization_capacity":"low"},"Japan":{"economic_diversification":"very_high","fiscal_resilience":"low","trade_integration_depth":"very_high","technology_production_capacity":"very_high","energy_autonomy":"very_low","institutional_stability":"very_high","regime_legitimacy_basis":"high","policy_implementation_capacity":"very_high","elite_cohesion":"high","social_contract_strength":"high","military_capability_tier":"medium","alliance_dependency":"very_high","strategic_depth":"low","domestic_security_control":"very_high","cyber_defensive_capacity":"high","resource_leverage_potential":"very_low","financial_system_centrality":"high","infrastructure_connectivity":"very_high","demographic_pressure":"very_high","ideological_mobilization_capacity":"low"}};
const PARAM_NAMES={"economic_diversification":"Economic Diversification","fiscal_resilience":"Fiscal Resilience","trade_integration_depth":"Trade Integration","technology_production_capacity":"Tech Production","energy_autonomy":"Energy Autonomy","institutional_stability":"Institutional Stability","regime_legitimacy_basis":"Regime Legitimacy","policy_implementation_capacity":"Policy Capacity","elite_cohesion":"Elite Cohesion","social_contract_strength":"Social Contract","military_capability_tier":"Military Capability","alliance_dependency":"Alliance Dependency","strategic_depth":"Strategic Depth","domestic_security_control":"Domestic Security","cyber_defensive_capacity":"Cyber Defense","resource_leverage_potential":"Resource Leverage","financial_system_centrality":"Financial Centrality","infrastructure_connectivity":"Infrastructure","demographic_pressure":"Demographics","ideological_mobilization_capacity":"Ideological Mobilization"};
let SCENARIO_LIBRARY={};let overrideCounter=0;

class CascadeEngine{constructor(){this.scale=["very_low","low","medium","high","very_high"];this.rules={trade_integration_depth_decrease:[{param:"alliance_dependency",effect:"increase",mag:1,conf:0.75,logic:"Loss of trade requires alternative alliances"}],fiscal_resilience_decrease:[{param:"policy_implementation_capacity",effect:"decrease",mag:1,conf:0.65,logic:"Fiscal crisis limits policy capacity"},{param:"social_contract_strength",effect:"decrease",mag:1,conf:0.60,logic:"Budget cuts damage social contract"}],military_capability_tier_increase:[{param:"fiscal_resilience",effect:"decrease",mag:1,conf:0.75,logic:"Militarization drains budget"}],energy_autonomy_decrease:[{param:"alliance_dependency",effect:"increase",mag:1,conf:0.80,logic:"Energy dependence requires alliances"}],regime_legitimacy_basis_decrease:[{param:"social_contract_strength",effect:"decrease",mag:1,conf:0.75,logic:"Legitimacy crisis undermines social contract"},{param:"elite_cohesion",effect:"decrease",mag:1,conf:0.55,logic:"Regime weakness triggers elite factionalism"}],elite_cohesion_decrease:[{param:"institutional_stability",effect:"decrease",mag:1,conf:0.70,logic:"Elite splits destabilize institutions"}],social_contract_strength_decrease:[{param:"domestic_security_control",effect:"decrease",mag:1,conf:0.60,logic:"Social contract breakdown leads to unrest"}]}}computeCascade(s,b){const r={tier1:[],tier2:[],tier3:[],tier4:[]};const st=JSON.parse(JSON.stringify(b));if(s.overrides){Object.keys(s.overrides).forEach(a=>{Object.keys(s.overrides[a]).forEach(p=>{const o=s.overrides[a][p];r.tier1.push({actor:a,parameter:p,baseline:b[a][p],new_value:o,confidence:0.85,mechanism:"Direct override",tier:1});st[a][p]=o})})}r.tier1.forEach(c=>{const k=`${c.parameter}_${this.getDirection(c.baseline,c.new_value)}`;const t=this.rules[k];if(t){t.forEach(rule=>{const cur=st[c.actor][rule.param];const nv=this.shift(cur,rule.effect,rule.mag);if(nv!==cur){r.tier2.push({actor:c.actor,parameter:rule.param,baseline:cur,new_value:nv,confidence:(c.confidence*rule.conf*0.7).toFixed(2),mechanism:rule.logic,triggered_by:`${c.actor}.${c.parameter}`,tier:2});st[c.actor][rule.param]=nv}})}});r.tier2.forEach(c=>{const k=`${c.parameter}_${this.getDirection(c.baseline,c.new_value)}`;const t=this.rules[k];if(t){t.forEach(rule=>{const cur=st[c.actor][rule.param];const nv=this.shift(cur,rule.effect,rule.mag);if(nv!==cur){r.tier3.push({actor:c.actor,parameter:rule.param,baseline:cur,new_value:nv,confidence:(c.confidence*rule.conf*0.7).toFixed(2),mechanism:rule.logic,triggered_by:c.triggered_by,tier:3});st[c.actor][rule.param]=nv}})}});const ch=[...r.tier1,...r.tier2,...r.tier3];const fc=ch.filter(c=>c.parameter==="fiscal_resilience"&&c.new_value.includes("low"));if(fc.length>0)r.tier4.push({type:"fiscal_death_spiral",description:"Fiscal resilience declining - risk of cascading crisis",risk:"high"});return r}getDirection(f,t){const fi=this.scale.indexOf(f);const ti=this.scale.indexOf(t);return ti>fi?"increase":"decrease"}shift(c,d,m){const i=this.scale.indexOf(c);const ni=d==="increase"?Math.min(i+m,this.scale.length-1):Math.max(i-m,0);return this.scale[ni]}}

const engine=new CascadeEngine();

window.onload=function(){Object.keys(BASELINE_DATA).forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a.replace('_',' ');document.getElementById('actor-select').appendChild(o)})};

function showPage(p){document.querySelectorAll('[id$="-page"]').forEach(pg=>pg.style.display='none');document.getElementById(p+'-page').style.display='block';document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));event.target.classList.add('active')}

function displayActorParams(){const a=document.getElementById('actor-select').value;const d=document.getElementById('parameter-display');if(!a){d.innerHTML='<p class="text-muted">Select actor</p>';return}const p=BASELINE_DATA[a];let h='<div class="row">';Object.keys(p).forEach(k=>{const v=p[k];h+=`<div class="col-md-6"><div class="parameter-row ${v}"><strong>${PARAM_NAMES[k]}</strong><span class="badge bg-secondary float-end">${v.replace('_',' ').toUpperCase()}</span></div></div>`});h+='</div>';d.innerHTML=h}

function addOverride(){const c=document.getElementById('overrides-container');const id=overrideCounter++;const d=document.createElement('div');d.className='action-item';d.innerHTML=`<div class="row g-2"><div class="col-md-4"><select class="form-select" id="oa-${id}"><option value="">Actor</option>${Object.keys(BASELINE_DATA).map(a=>`<option value="${a}">${a.replace('_',' ')}</option>`).join('')}</select></div><div class="col-md-4"><select class="form-select" id="op-${id}"><option value="">Parameter</option>${Object.keys(PARAM_NAMES).map(p=>`<option value="${p}">${PARAM_NAMES[p]}</option>`).join('')}</select></div><div class="col-md-3"><select class="form-select" id="ov-${id}"><option value="very_low">Very Low</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="very_high">Very High</option></select></div><div class="col-md-1"><button class="btn btn-sm btn-danger" onclick="this.parentElement.parentElement.parentElement.remove()">×</button></div></div>`;c.appendChild(d)}

function generateScenario(){const n=document.getElementById('scenario-name').value;const desc=document.getElementById('scenario-description').value;if(!n){alert('Enter name');return}const ov={};for(let i=0;i<overrideCounter;i++){const a=document.getElementById(`oa-${i}`);const p=document.getElementById(`op-${i}`);const v=document.getElementById(`ov-${i}`);if(a&&a.value&&p&&p.value){if(!ov[a.value])ov[a.value]={};ov[a.value][p.value]=v.value}}const s={id:n.replace(/\s+/g,'_').toUpperCase(),name:n,description:desc,overrides:ov};const casc=engine.computeCascade(s,BASELINE_DATA);s.cascade=casc;SCENARIO_LIBRARY[s.id]=s;const sel=document.getElementById('scenario-select');const opt=document.createElement('option');opt.value=s.id;opt.textContent=s.name;sel.appendChild(opt);updateCheckboxes();alert('✅ Generated!');showPage('cascade');sel.value=s.id;displayCascade()}

function displayCascade(){const id=document.getElementById('scenario-select').value;const d=document.getElementById('cascade-display');if(!id||!SCENARIO_LIBRARY[id]){d.innerHTML='<p class="text-muted">Select scenario</p>';return}const s=SCENARIO_LIBRARY[id];const c=s.cascade;let h=`<div class="card"><div class="card-header bg-primary text-white"><h5>${s.name}</h5><p class="mb-0">${s.description}</p></div></div>`;h+='<div class="card"><div class="card-header"><h5><span class="tier-badge tier-1">TIER 1</span>Direct Effects</h5></div><div class="card-body">';if(c.tier1.length===0)h+='<p>No changes</p>';else c.tier1.forEach(e=>{h+=`<div class="cascade-effect"><strong>${e.actor}</strong> → ${PARAM_NAMES[e.parameter]}<br><span class="badge bg-secondary">${e.baseline}</span> → <span class="badge bg-warning">${e.new_value}</span><div class="confidence-bar"><div class="confidence-fill" style="width:${e.confidence*100}%"></div></div><small>${e.mechanism}</small></div>`});h+='</div></div>';h+='<div class="card"><div class="card-header"><h5><span class="tier-badge tier-2">TIER 2</span>Secondary</h5></div><div class="card-body">';if(c.tier2.length===0)h+='<p>No effects</p>';else c.tier2.forEach(e=>{h+=`<div class="cascade-effect"><strong>${e.actor}</strong> → ${PARAM_NAMES[e.parameter]}<br><span class="badge bg-secondary">${e.baseline}</span> → <span class="badge bg-warning">${e.new_value}</span><div class="confidence-bar"><div class="confidence-fill" style="width:${e.confidence*100}%"></div></div><small>Triggered: ${e.triggered_by}<br>${e.mechanism}</small></div>`});h+='</div></div>';h+='<div class="card"><div class="card-header"><h5><span class="tier-badge tier-3">TIER 3</span>Strategic</h5></div><div class="card-body">';if(c.tier3.length===0)h+='<p>No effects</p>';else c.tier3.forEach(e=>{h+=`<div class="cascade-effect"><strong>${e.actor}</strong> → ${PARAM_NAMES[e.parameter]}<br><span class="badge bg-secondary">${e.baseline}</span> → <span class="badge bg-warning">${e.new_value}</span><div class="confidence-bar"><div class="confidence-fill" style="width:${e.confidence*100}%"></div></div><small>${e.mechanism}</small></div>`});h+='</div></div>';h+='<div class="card"><div class="card-header bg-danger text-white"><h5><span class="tier-badge tier-4">TIER 4</span>Risks</h5></div><div class="card-body">';if(c.tier4.length===0)h+='<p>No risks</p>';else c.tier4.forEach(l=>{h+=`<div class="feedback-loop"><strong>${l.type.toUpperCase()}</strong> (${l.risk})<br>${l.description}</div>`});h+='</div></div>';d.innerHTML=h}

function updateCheckboxes(){const c=document.getElementById('scenario-checkboxes');c.innerHTML='';Object.keys(SCENARIO_LIBRARY).forEach(id=>{const d=document.createElement('div');d.className='form-check';d.innerHTML=`<input class="form-check-input sc" type="checkbox" value="${id}" id="c-${id}"><label class="form-check-label" for="c-${id}">${SCENARIO_LIBRARY[id].name}</label>`;c.appendChild(d)})}

function compareScenarios(){const ch=Array.from(document.querySelectorAll('.sc:checked')).map(c=>c.value);const d=document.getElementById('comparison-results');if(ch.length===0){d.innerHTML='<div class="alert alert-warning">Select scenarios</div>';return}let h='<table class="table table-bordered"><thead><tr><th>Actor.Param</th>';ch.forEach(sid=>h+=`<th>${SCENARIO_LIBRARY[sid].name}</th>`);h+='</tr></thead><tbody>';const all=new Map();ch.forEach(sid=>{const s=SCENARIO_LIBRARY[sid];if(!s)return;[...s.cascade.tier1,...s.cascade.tier2,...s.cascade.tier3].forEach(c=>{const k=`${c.actor}.${c.parameter}`;if(!all.has(k))all.set(k,{});all.get(k)[sid]=c.new_value})});all.forEach((v,k)=>{const[a,p]=k.split('.');h+=`<tr><td><strong>${a}</strong><br><small>${PARAM_NAMES[p]}</small></td>`;ch.forEach(sid=>{const val=v[sid]||BASELINE_DATA[a][p];const isC=v[sid]&&v[sid]!==BASELINE_DATA[a][p];h+=`<td><span class="badge ${isC?'bg-warning':'bg-secondary'}">${val}</span></td>`});h+='</tr>'});h+='</tbody></table>';d.innerHTML=h}
    </script>
</body>
</html>
